name: Build macOS

# Reusable build for the macOS (Apple Silicon) disk image. UNSIGNED and not
# notarized: end users have to allow it in Gatekeeper (see release notes).
# Called by build.yml, or run by hand to test just this build.
# It only produces a workflow artifact; build.yml publishes the release.

on:
  workflow_call:
    inputs:
      tag:
        description: "Upstream tag, e.g. version_2.9.7+boss"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag, e.g. version_2.9.7+boss"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Patch and build macOS
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout upstream release tag
        uses: actions/checkout@v6
        with:
          repository: mjonuschat/PrusaSlicer
          ref: refs/tags/${{ inputs.tag }}

      - name: Checkout patch files from this repository
        uses: actions/checkout@v6
        with:
          path: .nowebview

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          git apply .nowebview/patches/no-webview-tabs.patch
          git status --short | grep -v '^?? .nowebview' || true

      - name: Setup build environment
        shell: bash
        run: |
          ver_pure=$(grep 'set(SLIC3R_VERSION' version.inc | cut -d '"' -f2)
          echo "dmg=PrusaSlicer-${ver_pure}+BOSS+MacOS-arm64-nowebview-$(date +'%Y%m%d').dmg" >> $GITHUB_ENV

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31'

      - name: Install dependencies
        run: |
          brew install automake git gettext libtool texinfo m4 zlib

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      # actions/cache builds its entry version from the cached path and the
      # compression tool on the runner. Restore and save must see the same zstd
      # state, otherwise save writes a gzip entry that no restore can find.
      - name: Uninstall zstd
        run: |
          brew uninstall --ignore-dependencies zstd || true

      - name: Determine cache keys
        id: cache-keys
        run: |
          echo cache-path=${{ github.workspace }}/deps/build/destdir >> "$GITHUB_OUTPUT"
          echo cache-key=${{ runner.os }}_arm64-deps-${{ hashFiles('deps/**/CMakeLists.txt', 'deps/**/*.cmake', 'deps/**/*.patch') }} >> "$GITHUB_OUTPUT"

      - name: Restore build dependencies cache
        id: cache-build-deps-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.cache-keys.outputs.cache-path }}
          key: ${{ steps.cache-keys.outputs.cache-key }}

      - name: Build dependencies
        if: steps.cache-build-deps-restore.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          cmake -P build.cmake -- --target deps --arch arm64

      - name: Save build dependencies cache
        if: steps.cache-build-deps-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.cache-keys.outputs.cache-path }}
          key: ${{ steps.cache-build-deps-restore.outputs.cache-primary-key }}

      - name: Install zstd
        if: always()
        env:
          HOMEBREW_CURL_PATH: /usr/bin/curl
        run: |
          brew install zstd

      - name: Build PrusaSlicer
        working-directory: ${{ github.workspace }}
        run: |
          cmake -P build.cmake -- --target install --arch arm64

      # Ad-hoc signature (no certificate needed). Makes the app bundle internally
      # consistent so macOS reports "unidentified developer" rather than "damaged".
      # Not a substitute for notarization; failure here is not fatal.
      - name: Ad-hoc sign app bundle
        working-directory: ${{ github.workspace }}
        run: |
          codesign --force --deep --sign - "build/PrusaSlicer/bin/PrusaSlicer.app" || echo "::warning::ad-hoc signing failed, continuing unsigned"

      - name: Create disk image
        working-directory: ${{ github.workspace }}
        run: |
          ln -s /Applications build/PrusaSlicer/bin/Applications
          hdiutil create -volname "PrusaSlicer" -srcfolder build/PrusaSlicer/bin -ov -format UDZO "${{ env.dmg }}"

      - name: Upload disk image
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: ${{ github.workspace }}/${{ env.dmg }}
          if-no-files-found: error
          retention-days: 7
