name: Build Linux flatpak (one architecture)

# Reusable build for ONE architecture of the Linux flatpak (x86_64 or aarch64;
# aarch64 runs natively on GitHub's free ARM runners). Called by build.yml, or run by hand
# (Actions -> Build Linux flatpak -> Run workflow) to test just this build.
# It only produces a workflow artifact; build.yml publishes the release.

on:
  workflow_call:
    inputs:
      tag:
        description: "Upstream tag, e.g. version_2.9.7+boss"
        required: true
        type: string
      arch:
        description: "x86_64 or aarch64"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag, e.g. version_2.9.7+boss"
        required: true
        type: string
      arch:
        description: "Architecture"
        required: true
        type: choice
        options:
          - x86_64
          - aarch64

permissions:
  contents: read

jobs:
  build:
    name: Patch and build flatpak (${{ inputs.arch }})
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 360
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout upstream release tag
        uses: actions/checkout@v6
        with:
          repository: mjonuschat/PrusaSlicer
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Checkout patch files from this repository
        uses: actions/checkout@v6
        with:
          path: .nowebview

      - name: Apply patch and commit it
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # flatpak-builder clones this repo from file://, so the patched tree
          # must be a real commit on a branch.
          git switch -c nowebview
          git apply --index .nowebview/patches/no-webview-tabs.patch
          git commit -m "Disable Printables and Physical Printer web view tabs"
          git log --oneline -n 2

      - name: Setup build environment
        shell: bash
        run: |
          ver_pure=$(grep 'set(SLIC3R_VERSION' version.inc | cut -d '"' -f2)
          echo "ver_pure=$ver_pure" >> $GITHUB_ENV
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "date_long=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "bundle=PrusaSlicer-${ver_pure}+BOSS+Linux-${{ inputs.arch }}-nowebview-$(date +'%Y%m%d').flatpak" >> $GITHUB_ENV
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Setup cmake
        if: inputs.arch == 'x86_64'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31'

      - name: Determine cache keys
        id: cache-keys
        run: |
          echo cache-path=${{ github.workspace }}/.flatpak-builder >> "$GITHUB_OUTPUT"
          echo cache-key=Linux_${{ inputs.arch }}-cache-deps-${{ hashFiles('deps/**') }} >> "$GITHUB_OUTPUT"

      - name: Restore build dependencies cache
        id: cache-build-deps-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.cache-keys.outputs.cache-path }}
          key: ${{ steps.cache-keys.outputs.cache-key }}

      - name: Update metainfo
        shell: bash
        run: |
          f=.flatpak/io.github.mjonuschat.PrusaSlicer.metainfo.xml
          sed --in-place -e "s/\"nightly\"/\"${ver_pure}\"/g" "$f"
          sed --in-place -e "s/2024-09-19/${date_long}/g" "$f"

      - name: Point the flatpak manifest at the patched commit
        shell: bash
        run: |
          # Pin deps to the last commit touching deps/ (keeps flatpak-builder's
          # module cache valid), and the app itself to the patched HEAD.
          deps_commit=$(git log -1 --format=%H -- deps/)
          if [ -z "$deps_commit" ]; then
            echo "::error::No commit found touching deps/"
            exit 1
          fi
          head_commit=$(git rev-parse HEAD)

          flatpak-builder --show-manifest .flatpak/io.github.mjonuschat.PrusaSlicer.yml | \
            jq --arg depsCommit "$deps_commit" --arg headCommit "$head_commit" \
              '.modules[] |= if .name == "PrusaSlicerDeps" then
                  (.sources[] |= if .type == "dir" and .path == ".." then
                      {
                          "type": "git",
                          "url": "file://${{ env.GITHUB_WORKSPACE }}",
                          "commit": $depsCommit,
                          "disable-lfs": true
                      }
                  else . end)
              elif .name == "PrusaSlicer" then
                  (.sources[] |= if .type == "dir" and .path == ".." then
                      {
                          "type": "git",
                          "url": "file://${{ env.GITHUB_WORKSPACE }}",
                          "commit": $headCommit,
                          "disable-lfs": true
                      }
                  else . end)
              else . end' > .flatpak/io.github.mjonuschat.PrusaSlicer.json

      - name: Build dependencies
        if: steps.cache-build-deps-restore.outputs.cache-hit != 'true'
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: PrusaSlicer-Dependencies.flatpak
          stop-at-module: PrusaSlicer
          manifest-path: .flatpak/io.github.mjonuschat.PrusaSlicer.json
          cache: false
          arch: ${{ inputs.arch }}
          upload-artifact: false

      - name: Build PrusaSlicer flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ env.bundle }}
          manifest-path: .flatpak/io.github.mjonuschat.PrusaSlicer.json
          cache: false
          arch: ${{ inputs.arch }}
          upload-artifact: false

      # Save after the full build (and also after a failed one) so the next
      # attempt can reuse the dependency stages.
      - name: Save build dependencies cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.cache-keys.outputs.cache-path }}
          key: ${{ steps.cache-build-deps-restore.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle-${{ inputs.arch }}
          path: ${{ env.bundle }}
          if-no-files-found: error
          retention-days: 7
